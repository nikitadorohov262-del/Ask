<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BuildIndustry — строительная компания</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #cfe9ff 0%, #eaf6ff 100%);
            min-height: 100vh;
        }

        /* Шапка */
        .header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(160, 200, 230, 0.5);
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: -0.5px;
        }
        .logo-build { color: #7cb342; }
        .logo-industry { color: #4a90e2; }
        .role-buttons {
            display: flex;
            gap: 10px;
        }
        .role-buttons button {
            background: rgba(100, 170, 140, 0.8);
            backdrop-filter: blur(4px);
            padding: 6px 18px;
            font-size: 14px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
            color: #1f3b2c;
        }
        .role-buttons button:hover {
            background: #7cb342;
            color: white;
        }
        .profile-area {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 240, 0.7);
            padding: 5px 15px;
            border-radius: 40px;
        }
        .profile-text {
            color: #2c5a7a;
            font-weight: 500;
            font-size: 14px;
        }
        .profile-icon {
            background-color: #7cb342;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            font-size: 18px;
            color: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }
        .profile-icon:hover {
            background-color: #558b2f;
            transform: scale(1.02);
        }

        /* Контейнер */
        .prototype-container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 30px 40px;
        }

        /* Карточки */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 6px 14px rgba(0, 20, 30, 0.08);
            border: 1px solid rgba(180, 210, 230, 0.6);
        }

        /* Баннер */
        .banner {
            background: linear-gradient(125deg, rgba(90, 162, 210, 0.9), rgba(125, 195, 135, 0.85));
            backdrop-filter: blur(2px);
            color: white;
            padding: 30px 20px;
            border-radius: 32px;
            text-align: center;
            margin-bottom: 24px;
        }
        .banner h1 {
            font-size: 44px;
            margin-bottom: 12px;
        }
        @media (max-width: 600px) {
            .banner h1 {
                font-size: 32px;
            }
        }

        /* Кнопки */
        button {
            background: rgba(100, 170, 140, 0.9);
            backdrop-filter: blur(4px);
            color: #1f3b2c;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }
        button:hover {
            background: #7cb342;
            color: white;
            transform: translateY(-1px);
        }

        /* Формы */
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #2c5a7a;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cfe1ed;
            border-radius: 20px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.8);
            transition: 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #7cb342;
            outline: none;
            background: white;
        }

        /* Прогресс-бар */
        .progress-container {
            background: rgba(200, 210, 220, 0.3);
            border-radius: 40px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .progress-bar {
            height: 10px;
            background: #7cb342;
            border-radius: 40px;
            width: 0%;
            transition: width 0.3s ease;
        }
        .step-indicators {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 25px;
        }
        .step {
            flex: 1;
            text-align: center;
            padding: 8px;
            background: rgba(200, 210, 220, 0.5);
            border-radius: 40px;
            font-weight: 600;
            color: #2c5a7a;
        }
        .step.active {
            background: #7cb342;
            color: white;
        }

        /* Dropzone */
        .dropzone {
            border: 2px dashed #cfe1ed;
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            background: rgba(255, 250, 225, 0.6);
            cursor: pointer;
            transition: 0.2s;
        }
        .dropzone.drag-over {
            border-color: #7cb342;
            background: rgba(124, 179, 66, 0.1);
        }

        /* Таблицы менеджера */
        .orders-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .orders-table th, .orders-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #d4e2ed;
        }
        .orders-table th {
            background: rgba(200, 225, 245, 0.5);
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-new { background: #f1c40f; color: #1f3b2c; }
        .status-progress { background: #3498db; color: white; }
        .status-completed { background: #7cb342; color: white; }
        .status-cancelled { background: #e74c3c; color: white; }

        .filter-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: flex-end;
        }
        .filter-bar select, .filter-bar input {
            width: auto;
            flex: 1;
            min-width: 150px;
        }

        /* Личный кабинет */
        .profile-tabs {
            display: flex;
            gap: 12px;
            border-bottom: 1px solid #b8d9e6;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent;
            box-shadow: none;
            border-radius: 40px 40px 0 0;
            padding: 8px 20px;
            color: #2c5a7a;
            margin-bottom: -1px;
        }
        .tab-btn.active {
            background: #7cb342;
            color: white;
        }
        .profile-section {
            display: none;
        }
        .profile-section.active-section {
            display: block;
        }
        .bonus-card {
            background: rgba(124, 179, 66, 0.15);
            border-radius: 24px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        /* Сетки */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .service-card, .review-card {
            background: rgba(255, 255, 245, 0.7);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(180, 210, 230, 0.4);
        }

        /* Уведомления, файлы */
        .notification-list, .file-list {
            list-style: none;
            padding: 0;
        }
        .notification-list li, .file-list li {
            padding: 12px 0;
            border-bottom: 1px solid #e0eef5;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Тосты */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #2c5a7a;
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            z-index: 3000;
            animation: fadeInOut 3s ease forwards;
            pointer-events: none;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        /* Модалка */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(50, 70, 80, 0.6);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 28px;
            padding: 25px;
            max-width: 90%;
            width: 450px;
            text-align: center;
            border-top: 6px solid #7cb342;
        }

        @media (max-width: 780px) {
            .prototype-container {
                padding: 0 15px;
            }
            .header {
                padding: 10px 15px;
            }
            .step-indicators {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo" id="logoBtn">
        <span class="logo-build">Build</span><span class="logo-industry">Industry</span>
    </div>
    <div class="role-buttons">
        <button id="switchToClientBtn">Я покупатель</button>
        <button id="switchToManagerBtn">Я менеджер</button>
    </div>
    <div class="profile-area">
        <span class="profile-text" id="roleLabel">Клиентский режим</span>
        <div class="profile-icon" id="profileIconBtn"><i class="fas fa-user-astronaut"></i></div>
    </div>
</div>

<div class="prototype-container" id="app">
    <!-- Клиентская часть -->
    <div id="clientScreen" style="display: block;">
        <div id="homeScreen" style="display: none;"></div>
        <div id="registerScreen" style="display: none;"></div>
        <div id="loginScreen" style="display: none;"></div>
        <div id="orderScreen" style="display: none;"></div>
        <div id="profileScreen" style="display: none;"></div>
    </div>
    <!-- Менеджерская часть -->
    <div id="managerScreen" style="display: none;">
        <div id="managerLoginScreen" style="display: block;"></div>
        <div id="managerDashboardScreen" style="display: none;"></div>
    </div>
</div>

<script>
    // ========== Состояние клиента ==========
    let state = {
        cookiesAccepted: false,
        isLoggedIn: false,
        isGuest: false,
        userName: '',
        userEmail: '',
        userPhone: ''
    };

    // ========== Данные менеджера ==========
    let managerLogged = false;
    let ordersData = [
        { id: 'BI-205', date: '15.04.2026', client: 'Иван Иванов', object: 'Дом', area: 120, amount: 340000, status: 'in_progress', statusText: 'В работе' },
        { id: 'BI-110', date: '10.02.2026', client: 'Мария Соколова', object: 'Квартира', area: 65, amount: 125000, status: 'completed', statusText: 'Выполнен' },
        { id: 'BI-098', date: '05.01.2026', client: 'Анна Петрова', object: 'Офис', area: 85, amount: 210000, status: 'completed', statusText: 'Выполнен' },
        { id: 'BI-075', date: '20.11.2025', client: 'Дмитрий Козлов', object: 'Квартира', area: 45, amount: 89000, status: 'cancelled', statusText: 'Отменён' },
        { id: 'BI-300', date: '01.05.2026', client: 'Гость (неавторизован)', object: 'Коттедж', area: 200, amount: 550000, status: 'new', statusText: 'Новый' }
    ];

    // ========== Общие утилиты ==========
    function showToast(message, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.backgroundColor = isError ? '#c0392b' : '#2c5a7a';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    let currentMode = 'client';

    function setMode(mode) {
        currentMode = mode;
        const clientDiv = document.getElementById('clientScreen');
        const managerDiv = document.getElementById('managerScreen');
        if (mode === 'client') {
            clientDiv.style.display = 'block';
            managerDiv.style.display = 'none';
            document.getElementById('roleLabel').innerText = 'Клиентский режим';
            updateClientScreen();
        } else {
            clientDiv.style.display = 'none';
            managerDiv.style.display = 'block';
            document.getElementById('roleLabel').innerText = 'Режим менеджера';
            renderManagerScreen();
        }
    }

    // ========== КЛИЕНТСКАЯ ЧАСТЬ (полноценная) ==========
    function saveState() { sessionStorage.setItem('buildIndustryState', JSON.stringify(state)); }
    function loadState() {
        const saved = sessionStorage.getItem('buildIndustryState');
        if (saved) { try { Object.assign(state, JSON.parse(saved)); } catch(e) {} }
        renderCookieBanner();
        updateClientScreen();
    }

    function showClientScreen(screenName) {
        document.querySelectorAll('#clientScreen > div').forEach(div => div.style.display = 'none');
        document.getElementById(screenName + 'Screen').style.display = 'block';
        sessionStorage.setItem('currentClientScreen', screenName);
    }

    function updateClientScreen() {
        const current = sessionStorage.getItem('currentClientScreen') || 'home';
        renderClientScreen(current);
        showClientScreen(current);
    }

    function renderClientScreen(screen) {
        if (screen === 'home') renderHome();
        else if (screen === 'register') renderRegister();
        else if (screen === 'login') renderLogin();
        else if (screen === 'order') renderOrder();
        else if (screen === 'profile') renderProfile();
    }

    // Cookie баннер
    function renderCookieBanner() {
        const old = document.getElementById('cookieBanner');
        if (old) old.remove();
        if (!state.cookiesAccepted) {
            const banner = document.createElement('div');
            banner.id = 'cookieBanner';
            banner.className = 'cookie-banner';
            banner.style.cssText = 'position:fixed; bottom:0; left:0; right:0; background:rgba(230,245,255,0.95); backdrop-filter:blur(12px); color:#2c5a7a; padding:12px 20px; display:flex; justify-content:space-between; flex-wrap:wrap; z-index:1100; border-top:1px solid #7cb342;';
            banner.innerHTML = `<span><i class="fas fa-cookie-bite"></i> Примите cookie для оформления заказа.</span><div><button id="acceptCookieBtn" style="background:#7cb342; color:white;">Принять</button><button id="rejectCookieBtn" style="background:#9aaeb7;">Отклонить</button></div>`;
            document.body.appendChild(banner);
            document.getElementById('acceptCookieBtn').onclick = () => acceptCookies();
            document.getElementById('rejectCookieBtn').onclick = () => rejectCookies();
        }
    }

    function acceptCookies() { state.cookiesAccepted = true; saveState(); renderCookieBanner(); showToast('Cookie приняты'); if (sessionStorage.getItem('currentClientScreen') === 'order') renderOrder(); }
    function rejectCookies() { state.cookiesAccepted = false; saveState(); showToast('Cookie отклонены'); if (sessionStorage.getItem('currentClientScreen') === 'order') renderOrder(); }

    function showModal() { document.getElementById('actionModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('actionModal').style.display = 'none'; }

    // Главная страница (наполненная)
    function renderHome() {
        const container = document.getElementById('homeScreen');
        container.innerHTML = `
            <div class="banner">
                <h1><span class="logo-build">Build</span><span class="logo-industry">Industry</span></h1>
                <p>Строительство и ремонт под ключ – надёжно, прозрачно, с душой</p>
                <button id="leaveRequestBtn">Оставить заявку</button>
            </div>
            <div class="card">
                <h3>Почему выбирают нас</h3>
                <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:15px;">
                    <div><i class="fas fa-trophy fa-2x" style="color:#7cb342"></i><br>15+ лет опыта</div>
                    <div><i class="fas fa-chart-line fa-2x" style="color:#7cb342"></i><br>100% прозрачная смета</div>
                    <div><i class="fas fa-users fa-2x" style="color:#7cb342"></i><br>50+ квалифицированных бригад</div>
                    <div><i class="fas fa-calendar-alt fa-2x" style="color:#7cb342"></i><br>Соблюдение сроков</div>
                </div>
            </div>
            <div class="card">
                <h3>Наши услуги</h3>
                <div class="services-grid">
                    <div class="service-card"><i class="fas fa-hammer fa-2x"></i><h4>Демонтажные работы</h4><p>Полный демонтаж стен, перегородок, стяжки</p></div>
                    <div class="service-card"><i class="fas fa-fill-drip fa-2x"></i><h4>Штукатурка и стяжка</h4><p>Выравнивание стен и полов под ключ</p></div>
                    <div class="service-card"><i class="fas fa-bolt fa-2x"></i><h4>Электромонтаж</h4><p>Разводка, установка щитков, розеток</p></div>
                    <div class="service-card"><i class="fas fa-wrench fa-2x"></i><h4>Сантехника</h4><p>Монтаж труб, санфаянса, отопления</p></div>
                    <div class="service-card"><i class="fas fa-paint-roller fa-2x"></i><h4>Отделочные работы</h4><p>Покраска, обои, плитка, натяжные потолки</p></div>
                    <div class="service-card"><i class="fas fa-home fa-2x"></i><h4>Фасадные работы</h4><p>Утепление, штукатурка, вентилируемые фасады</p></div>
                </div>
            </div>
            <div class="card">
                <h3>Отзывы клиентов</h3>
                <div class="services-grid" style="grid-template-columns:repeat(auto-fill, minmax(240px,1fr));">
                    <div class="review-card"><i class="fas fa-star" style="color:#f1c40f"></i><h4>Анна С.</h4><p>"Всё вовремя, качественно. Смета не менялась. Спасибо!"</p></div>
                    <div class="review-card"><i class="fas fa-star" style="color:#f1c40f"></i><h4>Игорь К.</h4><p>"Работы выполнены на отлично, бригада вежливая."</p></div>
                    <div class="review-card"><i class="fas fa-star" style="color:#f1c40f"></i><h4>Мария Д.</h4><p>"Очень удобный сайт, быстро оформила заказ."</p></div>
                </div>
            </div>
            <div class="card">
                <h3>Контакты</h3>
                <p><i class="fas fa-phone-alt"></i> +7 (3452) 123-456 &nbsp;|&nbsp; <i class="fas fa-envelope"></i> info@buildindustry.ru &nbsp;|&nbsp; <i class="fas fa-map-marker-alt"></i> г. Тюмень, ул. Республики, 123</p>
            </div>
        `;
        document.getElementById('leaveRequestBtn').onclick = () => { if(!state.cookiesAccepted){ showToast('Примите cookie'); return; } showModal(); };
    }

    // Регистрация
    function renderRegister() {
        document.getElementById('registerScreen').innerHTML = `
            <div class="card">
                <h2>Регистрация</h2>
                <div class="form-group"><label>ФИО</label><input type="text" id="regName" placeholder="Иванов Иван"></div>
                <div class="form-group"><label>Email</label><input type="email" id="regEmail" placeholder="ivan@buildindustry.ru"></div>
                <div class="form-group"><label>Телефон</label><input type="tel" id="regPhone" placeholder="+7..."></div>
                <div class="form-group"><label>Пароль</label><input type="password" id="regPassword" placeholder="минимум 6 символов"></div>
                <button id="registerSubmitBtn">Зарегистрироваться</button>
                <div style="margin-top:15px"><a id="switchToLogin" style="cursor:pointer; color:#4a90e2;">Уже есть аккаунт? Войти</a> | <a id="backToHomeFromReg" style="cursor:pointer; color:#4a90e2;">На главную</a></div>
            </div>
        `;
        document.getElementById('registerSubmitBtn').onclick = () => {
            const name = document.getElementById('regName').value, email = document.getElementById('regEmail').value;
            if (!name || !email) { showToast('Заполните имя и email', true); return; }
            state.isLoggedIn = true; state.isGuest = false; state.userName = name; state.userEmail = email; state.userPhone = document.getElementById('regPhone').value || '+7 (000) 000-00-00';
            saveState(); showToast('Регистрация успешна'); sessionStorage.setItem('currentClientScreen','order'); renderClientScreen('order'); showClientScreen('order');
        };
        document.getElementById('switchToLogin').onclick = () => { sessionStorage.setItem('currentClientScreen','login'); renderClientScreen('login'); showClientScreen('login'); };
        document.getElementById('backToHomeFromReg').onclick = () => { sessionStorage.setItem('currentClientScreen','home'); renderClientScreen('home'); showClientScreen('home'); };
    }

    // Вход
    function renderLogin() {
        document.getElementById('loginScreen').innerHTML = `
            <div class="card">
                <h2>Вход</h2>
                <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="user@buildindustry.ru"></div>
                <div class="form-group"><label>Пароль</label><input type="password" id="loginPassword" placeholder="******"></div>
                <button id="loginSubmitBtn">Войти</button>
                <div style="margin-top:15px"><a id="switchToRegister" style="cursor:pointer; color:#4a90e2;">Нет аккаунта? Зарегистрироваться</a> | <a id="backToHomeFromLogin" style="cursor:pointer; color:#4a90e2;">На главную</a></div>
            </div>
        `;
        document.getElementById('loginSubmitBtn').onclick = () => {
            const email = document.getElementById('loginEmail').value;
            if (!email) { showToast('Введите email', true); return; }
            state.isLoggedIn = true; state.isGuest = false; state.userName = 'Иван Иванов'; state.userEmail = email; state.userPhone = '+7 (999) 123-45-67';
            saveState(); showToast('Вход выполнен'); sessionStorage.setItem('currentClientScreen','order'); renderClientScreen('order'); showClientScreen('order');
        };
        document.getElementById('switchToRegister').onclick = () => { sessionStorage.setItem('currentClientScreen','register'); renderClientScreen('register'); showClientScreen('register'); };
        document.getElementById('backToHomeFromLogin').onclick = () => { sessionStorage.setItem('currentClientScreen','home'); renderClientScreen('home'); showClientScreen('home'); };
    }

    // Форма заказа с прогресс-баром (3 шага)
    let currentStep = 1;
    let orderFormData = { name: '', phone: '', email: '', objectType: 'Квартира', address: '', area: '', workTypes: [], details: '', files: [] };
    let fileList = [];

    function updateProgress() {
        const totalSteps = 3;
        const progressPercent = ((currentStep - 1) / (totalSteps - 1)) * 100;
        const progBar = document.getElementById('orderProgressBar');
        if (progBar) progBar.style.width = progressPercent + '%';
        for (let i = 1; i <= 3; i++) {
            const stepEl = document.getElementById(`step${i}`);
            if (stepEl) {
                if (i === currentStep) stepEl.classList.add('active');
                else stepEl.classList.remove('active');
            }
        }
    }

    function goToStep(step) {
        if (currentStep === 1) {
            orderFormData.name = document.getElementById('orderName')?.value || '';
            orderFormData.phone = document.getElementById('orderPhone')?.value || '';
            orderFormData.email = document.getElementById('orderEmail')?.value || '';
        } else if (currentStep === 2) {
            orderFormData.objectType = document.getElementById('objectType')?.value || 'Квартира';
            orderFormData.address = document.getElementById('address')?.value || '';
            orderFormData.area = document.getElementById('area')?.value || '';
            const checkboxes = document.querySelectorAll('input[name="workType"]:checked');
            orderFormData.workTypes = Array.from(checkboxes).map(cb => cb.value);
        } else if (currentStep === 3) {
            orderFormData.details = document.getElementById('orderDetails')?.value || '';
        }
        currentStep = step;
        renderOrderStep();
        updateProgress();
    }

    function setupDragAndDrop() {
        const dropzone = document.getElementById('dropzone');
        const fileDisplay = document.getElementById('fileListDisplay');
        if (!dropzone) return;
        const updateFileList = () => {
            if (fileDisplay) fileDisplay.innerHTML = fileList.map(f => `<div>📄 ${f.name} (${(f.size/1024).toFixed(1)} КБ)</div>`).join('');
        };
        dropzone.addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.multiple = true;
            input.onchange = (e) => { fileList.push(...Array.from(e.target.files)); updateFileList(); };
            input.click();
        });
        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag-over'); });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('drag-over');
            fileList.push(...Array.from(e.dataTransfer.files));
            updateFileList();
        });
        updateFileList();
    }

    function submitOrderFinal() {
        const consent = document.getElementById('consentOrderFinal');
        if (!consent?.checked) { showToast('Необходимо дать согласие на обработку данных.', true); return; }
        const orderNumber = 'BI-' + Math.floor(Math.random() * 10000);
        showToast(`Заказ ${orderNumber} отправлен! Смета будет направлена на email.`);
        sessionStorage.setItem('currentClientScreen', 'home');
        renderClientScreen('home');
        showClientScreen('home');
    }

    function renderOrderStep() {
        const container = document.getElementById('orderScreen');
        if (!state.cookiesAccepted) {
            container.innerHTML = `<div class="card"><h3>Доступ запрещён</h3><p>Необходимо принять cookie.</p><button id="retryCookieBtn">Принять cookie</button></div>`;
            document.getElementById('retryCookieBtn')?.addEventListener('click', acceptCookies);
            return;
        }
        let stepHtml = '';
        if (currentStep === 1) {
            stepHtml = `
                <div class="card">
                    <h3>Шаг 1: Контактная информация</h3>
                    <div class="form-group"><label>ФИО</label><input type="text" id="orderName" value="${orderFormData.name || state.userName || ''}" placeholder="Иванов Иван"></div>
                    <div class="form-group"><label>Телефон</label><input type="tel" id="orderPhone" value="${orderFormData.phone || state.userPhone || ''}" placeholder="+7..."></div>
                    <div class="form-group"><label>Email</label><input type="email" id="orderEmail" value="${orderFormData.email || state.userEmail || ''}" placeholder="ivan@example.com"></div>
                </div>
                <div style="display:flex; justify-content:flex-end;"><button id="nextStep1">Далее →</button></div>
            `;
        } else if (currentStep === 2) {
            const workChecks = ['Демонтаж', 'Штукатурка', 'Электрика', 'Сантехника', 'Отделка'].map(w => `<label><input type="checkbox" name="workType" value="${w}" ${orderFormData.workTypes.includes(w) ? 'checked' : ''}> ${w}</label>`).join('');
            stepHtml = `
                <div class="card">
                    <h3>Шаг 2: Данные об объекте и виды работ</h3>
                    <div class="form-group"><label>Тип объекта</label><select id="objectType">${['Квартира','Дом','Офис'].map(t => `<option ${orderFormData.objectType===t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
                    <div class="form-group"><label>Адрес</label><input type="text" id="address" value="${orderFormData.address}" placeholder="г. Тюмень, ул. Ленина, д. 1"></div>
                    <div class="form-group"><label>Площадь (м²)</label><input type="number" id="area" value="${orderFormData.area}" placeholder="65"></div>
                    <div class="form-group"><label>Виды работ</label><div style="display:flex; gap:15px; flex-wrap:wrap;">${workChecks}</div></div>
                </div>
                <div style="display:flex; justify-content:space-between;"><button id="prevStep2">← Назад</button><button id="nextStep2">Далее →</button></div>
            `;
        } else {
            stepHtml = `
                <div class="card">
                    <h3>Шаг 3: Дополнительная информация</h3>
                    <div class="form-group"><label>Детали работ (необязательно)</label><textarea id="orderDetails" rows="4" placeholder="Опишите особые пожелания...">${orderFormData.details}</textarea></div>
                    <div class="form-group"><label>Прикрепить файлы (чертежи, фото)</label>
                        <div id="dropzone" class="dropzone">📎 Перетащите файлы сюда или нажмите для выбора</div>
                        <div id="fileListDisplay" class="file-list" style="margin-top:15px;"></div>
                    </div>
                </div>
                <div class="card"><label><input type="checkbox" id="consentOrderFinal"> Я согласен на обработку персональных данных</label></div>
                <div style="display:flex; justify-content:space-between;"><button id="prevStep3">← Назад</button><button id="submitOrderFinal">Отправить заявку</button></div>
            `;
        }
        container.innerHTML = `
            <h2>Оформление заявки</h2>
            <div class="progress-container"><div class="progress-bar" id="orderProgressBar" style="width:0%"></div></div>
            <div class="step-indicators">
                <div class="step ${currentStep===1?'active':''}" id="step1">1. Контакты</div>
                <div class="step ${currentStep===2?'active':''}" id="step2">2. Объект и работы</div>
                <div class="step ${currentStep===3?'active':''}" id="step3">3. Дополнительно</div>
            </div>
            ${stepHtml}
        `;
        if (currentStep === 1) document.getElementById('nextStep1')?.addEventListener('click', () => goToStep(2));
        else if (currentStep === 2) {
            document.getElementById('prevStep2')?.addEventListener('click', () => goToStep(1));
            document.getElementById('nextStep2')?.addEventListener('click', () => goToStep(3));
        } else {
            document.getElementById('prevStep3')?.addEventListener('click', () => goToStep(2));
            document.getElementById('submitOrderFinal')?.addEventListener('click', submitOrderFinal);
            setupDragAndDrop();
        }
        updateProgress();
    }

    function renderOrder() { currentStep = 1; orderFormData = { name: state.userName || '', phone: state.userPhone || '', email: state.userEmail || '', objectType: 'Квартира', address: '', area: '', workTypes: [], details: '', files: [] }; fileList = []; renderOrderStep(); }

    // Личный кабинет с вкладками
    let currentTab = 'profile';
    function renderProfile() {
        const container = document.getElementById('profileScreen');
        if (!state.isLoggedIn || state.isGuest) {
            container.innerHTML = `<div class="card"><h3>Доступ ограничен</h3><button id="backToHomeBtn">На главную</button></div>`;
            document.getElementById('backToHomeBtn').onclick = () => { sessionStorage.setItem('currentClientScreen','home'); renderClientScreen('home'); showClientScreen('home'); };
            return;
        }
        const orders = [
            { id: 'BI-205', date: '15.04.2026', object: 'Дом', area: 120, amount: 340000, status: 'В работе', statusClass: 'status-progress' },
            { id: 'BI-110', date: '10.02.2026', object: 'Квартира', area: 65, amount: 125000, status: 'Выполнен', statusClass: 'status-completed' },
            { id: 'BI-098', date: '05.01.2026', object: 'Офис', area: 85, amount: 210000, status: 'Выполнен', statusClass: 'status-completed' }
        ];
        const notifications = [
            { icon: 'fa-check-circle', text: 'Заказ #BI-205 принят в работу', date: '16.04.2026', color: '#7cb342' },
            { icon: 'fa-file-pdf', text: 'Смета по заказу #BI-205 готова', date: '14.04.2026', color: '#3498db' }
        ];
        const files = [
            { name: 'Договор_BI-205.pdf', size: '245 КБ', type: 'pdf' },
            { name: 'Смета_BI-205.pdf', size: '120 КБ', type: 'pdf' }
        ];
        const ordersTableRows = orders.map(o => `
            <tr>
                <td>${o.id}</td><td>${o.date}</td><td>${o.object}</td><td>${o.area} м²</td><td>${o.amount.toLocaleString()} ₽</td>
                <td><span class="status-badge ${o.statusClass}">${o.status}</span></td>
                <td><button class="repeatOrderBtn" data-id="${o.id}" style="padding:4px 12px;">Повторить</button></td>
            </tr>
        `).join('');
        container.innerHTML = `
            <div class="card">
                <div class="bonus-card">
                    <div><i class="fas fa-gem fa-2x" style="color:#f1c40f"></i> <strong>1250 баллов</strong> → скидка 5%</div>
                    <div>До уровня "Золотой" осталось 750 баллов</div>
                </div>
                <div class="profile-tabs">
                    <button class="tab-btn ${currentTab === 'profile' ? 'active' : ''}" data-tab="profile"><i class="fas fa-user-circle"></i> Профиль</button>
                    <button class="tab-btn ${currentTab === 'orders' ? 'active' : ''}" data-tab="orders"><i class="fas fa-shopping-bag"></i> Заказы</button>
                    <button class="tab-btn ${currentTab === 'notifications' ? 'active' : ''}" data-tab="notifications"><i class="fas fa-bell"></i> Уведомления</button>
                    <button class="tab-btn ${currentTab === 'files' ? 'active' : ''}" data-tab="files"><i class="fas fa-paperclip"></i> Файлы</button>
                </div>
                <div id="profileSection" class="profile-section ${currentTab === 'profile' ? 'active-section' : ''}">
                    <div class="form-group"><label>ФИО</label><input type="text" id="editName" value="${state.userName}"></div>
                    <div class="form-group"><label>Email</label><input type="email" id="editEmail" value="${state.userEmail}"></div>
                    <div class="form-group"><label>Телефон</label><input type="tel" id="editPhone" value="${state.userPhone}"></div>
                    <div class="form-group"><label>Новый пароль</label><input type="password" id="editPassword" placeholder="оставьте пустым, если не меняете"></div>
                    <button id="saveProfileBtn">Сохранить изменения</button>
                </div>
                <div id="ordersSection" class="profile-section ${currentTab === 'orders' ? 'active-section' : ''}">
                    <div class="card" style="background: #eef4fa;"><h4>Активный заказ</h4><p><strong>№ BI-205</strong> — Дом, 120 м², 340 000 ₽, статус: В работе</p><div class="progress-container"><div class="progress-bar" style="width:45%; background:#3498db;"></div></div><p>Плановое завершение: 25.05.2026</p></div>
                    <h4>История заказов</h4>
                    <table class="orders-table"><thead><tr><th>№</th><th>Дата</th><th>Объект</th><th>Площадь</th><th>Сумма</th><th>Статус</th><th></th></tr></thead><tbody>${ordersTableRows}</tbody></table>
                </div>
                <div id="notificationsSection" class="profile-section ${currentTab === 'notifications' ? 'active-section' : ''}">
                    <ul class="notification-list">${notifications.map(n => `<li><i class="fas ${n.icon}" style="color:${n.color}"></i> ${n.text} <span style="margin-left:auto;">${n.date}</span></li>`).join('')}</ul>
                </div>
                <div id="filesSection" class="profile-section ${currentTab === 'files' ? 'active-section' : ''}">
                    <ul class="file-list">${files.map(f => `<li><i class="fas fa-file-pdf" style="color:#e67e22;"></i> ${f.name} (${f.size}) <button class="downloadFileBtn" style="margin-left:auto;">Скачать</button></li>`).join('')}</ul>
                    <button id="uploadFileBtn">Загрузить новый файл</button>
                </div>
            </div>
        `;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => { currentTab = btn.getAttribute('data-tab'); renderProfile(); }));
        document.getElementById('saveProfileBtn')?.addEventListener('click', () => {
            const newName = document.getElementById('editName').value, newEmail = document.getElementById('editEmail').value;
            if (newName && newEmail) { state.userName = newName; state.userEmail = newEmail; state.userPhone = document.getElementById('editPhone').value; saveState(); showToast('Профиль обновлён'); renderProfile(); }
            else showToast('Заполните имя и email', true);
        });
        document.querySelectorAll('.repeatOrderBtn').forEach(btn => btn.addEventListener('click', () => { showToast('Повтор заказа – перенаправление на форму'); sessionStorage.setItem('currentClientScreen','order'); renderClientScreen('order'); showClientScreen('order'); }));
        document.querySelectorAll('.downloadFileBtn').forEach(btn => btn.addEventListener('click', () => showToast('Скачивание файла (демо)')));
        document.getElementById('uploadFileBtn')?.addEventListener('click', () => showToast('Загрузка файлов будет доступна позже'));
    }

    // ========== МЕНЕДЖЕРСКАЯ ЧАСТЬ ==========
    function renderManagerScreen() {
        const managerContainer = document.getElementById('managerScreen');
        if (!managerLogged) {
            managerContainer.innerHTML = `
                <div id="managerLoginScreen">
                    <div class="card" style="max-width: 450px; margin: 50px auto;">
                        <h2>Вход для менеджера</h2>
                        <div class="form-group"><label>Email</label><input type="email" id="managerEmail" placeholder="manager@buildindustry.ru"></div>
                        <div class="form-group"><label>Пароль</label><input type="password" id="managerPassword" placeholder="******"></div>
                        <button id="managerLoginBtn">Войти</button>
                        <p style="margin-top:15px;">Демо-логин: manager@buildindustry.ru / password</p>
                    </div>
                </div>
                <div id="managerDashboardScreen" style="display: none;"></div>
            `;
            document.getElementById('managerLoginBtn').onclick = () => {
                const email = document.getElementById('managerEmail').value;
                const pwd = document.getElementById('managerPassword').value;
                if (email === 'manager@buildindustry.ru' && pwd === 'password') {
                    managerLogged = true;
                    renderManagerDashboard();
                } else {
                    showToast('Неверный логин или пароль', true);
                }
            };
        } else {
            renderManagerDashboard();
        }
    }

    function renderManagerDashboard() {
        const dashboardDiv = document.getElementById('managerDashboardScreen');
        const loginDiv = document.getElementById('managerLoginScreen');
        if (loginDiv) loginDiv.style.display = 'none';
        dashboardDiv.style.display = 'block';

        function refreshTable() {
            const statusFilter = document.getElementById('statusFilter')?.value || 'all';
            const search = document.getElementById('searchOrder')?.value.toLowerCase() || '';
            const filtered = ordersData.filter(o => (statusFilter === 'all' || o.status === statusFilter) && (search === '' || o.id.toLowerCase().includes(search)));
            const rows = filtered.map(o => `
                <tr>
                    <td>${o.id}</td><td>${o.date}</td><td>${o.client}</td><td>${o.object}</td><td>${o.area} м²</td><td>${o.amount.toLocaleString()} ₽</td>
                    <td><span class="status-badge status-${o.status === 'new' ? 'new' : (o.status === 'in_progress' ? 'progress' : (o.status === 'completed' ? 'completed' : 'cancelled'))}">${o.statusText}</span></td>
                    <td><select class="statusChange" data-id="${o.id}"><option value="new" ${o.status==='new'?'selected':''}>Новый</option><option value="in_progress" ${o.status==='in_progress'?'selected':''}>В работе</option><option value="completed" ${o.status==='completed'?'selected':''}>Выполнен</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>Отменён</option></select></td>
                    <td><button class="viewDetailsBtn" data-id="${o.id}">Детали</button></td>
                </tr>
            `).join('');
            dashboardDiv.innerHTML = `
                <div class="card">
                    <h2>Управление заказами</h2>
                    <div class="filter-bar">
                        <select id="statusFilter"><option value="all">Все статусы</option><option value="new">Новые</option><option value="in_progress">В работе</option><option value="completed">Выполненные</option><option value="cancelled">Отменённые</option></select>
                        <input type="text" id="searchOrder" placeholder="Поиск по номеру заказа">
                        <button id="applyFilter">Применить</button>
                    </div>
                    <table class="orders-table"><thead><tr><th>№</th><th>Дата</th><th>Клиент</th><th>Объект</th><th>Площадь</th><th>Сумма</th><th>Статус</th><th>Изменить статус</th><th></th></tr></thead><tbody>${rows}</tbody></table>
                </div>
            `;
            document.getElementById('applyFilter').onclick = refreshTable;
            document.getElementById('searchOrder').addEventListener('input', refreshTable);
            document.querySelectorAll('.statusChange').forEach(sel => {
                sel.addEventListener('change', (e) => {
                    const id = sel.getAttribute('data-id');
                    const order = ordersData.find(o => o.id === id);
                    if (order) {
                        order.status = sel.value;
                        order.statusText = sel.value === 'new' ? 'Новый' : (sel.value === 'in_progress' ? 'В работе' : (sel.value === 'completed' ? 'Выполнен' : 'Отменён'));
                        showToast(`Статус заказа ${id} изменён`);
                        refreshTable();
                    }
                });
            });
            document.querySelectorAll('.viewDetailsBtn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.getAttribute('data-id');
                    const order = ordersData.find(o => o.id === id);
                    alert(`Заказ ${order.id}\nКлиент: ${order.client}\nОбъект: ${order.object}, ${order.area} м²\nСумма: ${order.amount} ₽\nСтатус: ${order.statusText}`);
                });
            });
        }
        refreshTable();
    }

    // Переключение режимов и обработчики
    document.getElementById('switchToClientBtn').onclick = () => setMode('client');
    document.getElementById('switchToManagerBtn').onclick = () => setMode('manager');
    document.getElementById('logoBtn').onclick = () => { if (currentMode === 'client') { sessionStorage.setItem('currentClientScreen','home'); renderClientScreen('home'); showClientScreen('home'); } };
    document.getElementById('profileIconBtn').onclick = () => {
        if (currentMode === 'client') {
            if (state.isLoggedIn && !state.isGuest) { sessionStorage.setItem('currentClientScreen','profile'); renderClientScreen('profile'); showClientScreen('profile'); }
            else showToast('Личный кабинет доступен после входа');
        } else {
            showToast('В режиме менеджера личный кабинет не доступен');
        }
    };

    // Инициализация модалки
    const modalDiv = document.createElement('div');
    modalDiv.id = 'actionModal';
    modalDiv.className = 'modal';
    modalDiv.innerHTML = `<div class="modal-content"><i class="fas fa-hand-peace fa-3x" style="color:#7cb342;"></i><p>Для оформления заявки необходимо зарегистрироваться или войти.<br>Вы также можете продолжить как <strong>гость</strong>.</p><div class="modal-buttons"><button id="modalRegisterBtn">Зарегистрироваться</button><button id="modalLoginBtn">Войти</button><button id="modalGuestBtn">Гость</button></div></div>`;
    document.body.appendChild(modalDiv);
    document.getElementById('modalRegisterBtn').onclick = () => { document.getElementById('actionModal').style.display = 'none'; sessionStorage.setItem('currentClientScreen','register'); renderClientScreen('register'); showClientScreen('register'); };
    document.getElementById('modalLoginBtn').onclick = () => { document.getElementById('actionModal').style.display = 'none'; sessionStorage.setItem('currentClientScreen','login'); renderClientScreen('login'); showClientScreen('login'); };
    document.getElementById('modalGuestBtn').onclick = () => { document.getElementById('actionModal').style.display = 'none'; if(!state.cookiesAccepted){ showToast('Примите cookie'); return; } state.isLoggedIn=false; state.isGuest=true; state.userName='Гость'; saveState(); sessionStorage.setItem('currentClientScreen','order'); renderClientScreen('order'); showClientScreen('order'); };
    window.showModal = () => document.getElementById('actionModal').style.display = 'flex';
    window.closeModal = () => document.getElementById('actionModal').style.display = 'none';

    // Старт
    function init() { loadState(); setMode('client'); }
    init();
</script>
</body>
</html>
